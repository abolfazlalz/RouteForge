stages: [lint, test, build, docker, release]
variables:
  CGO_ENABLED: "0"
  IMAGE: "$CI_REGISTRY_IMAGE"
lint:
  stage: lint
  image: golang:1.26
  script: ["go vet ./..."]
test:
  stage: test
  image: golang:1.26
  script: ["go test ./...", "go test -race ./..."]
build:
  stage: build
  image: golang:1.26
  parallel:
    matrix:
      - GOOS: [linux]
        GOARCH: [amd64, arm64]
      - GOOS: [darwin]
        GOARCH: [amd64, arm64]
      - GOOS: [windows]
        GOARCH: [amd64]
  script:
    - mkdir -p dist
    - SUFFIX=""; [ "$GOOS" != windows ] || SUFFIX=.exe
    - go build -trimpath -ldflags "-X github.com/routeforge/routeforge/internal/version.Value=$CI_COMMIT_TAG" -o "dist/rforge-$GOOS-$GOARCH$SUFFIX" ./cmd/rforge
  artifacts:
    paths: [dist/]
    expire_in: 30 days
docker:
  stage: docker
  image: docker:27.5.1
  services: ["docker:27.5.1-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use
    - docker buildx build --platform linux/amd64,linux/arm64 -t "$IMAGE:$CI_COMMIT_REF_SLUG" --push .
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
release:
  stage: release
  image: alpine:3.21
  script:
    - echo "Release artifacts are supplied by build jobs; publish GitLab Release using release-cli in project configuration."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
